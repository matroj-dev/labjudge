{% extends "base.html" %}

{% block title %}参赛 - {{ contest_title }}{% endblock %}

{% block content %}
<section class="card stack">
  <h1>{{ contest_title }}</h1>
  {% if error.len() > 0 %}
  <div class="error-box">{{ error }}</div>
  {% endif %}

  <form method="post" action="/c/{{ contest_id }}/join" class="stack" autocomplete="off">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>
      账号
      <input type="text" name="student_id" value="{{ student_id }}" maxlength="64" required autofocus>
    </label>
    <label>
      密码
      <input type="password" name="password" maxlength="64" required autocomplete="new-password">
    </label>

    <button type="submit">进入比赛</button>
  </form>

  <p class="muted">密码是账号的后 6 位。登不进去请联系老师。</p>
</section>
{% endblock %}
