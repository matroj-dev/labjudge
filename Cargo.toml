[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "2"

[package]
name = "labjudge"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
publish = false

[lib]
name = "labjudge"
path = "src/lib.rs"

[[bin]]
name = "labjudge"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.97"
askama = "=0.12.1"
async-trait = "=0.1.88"
axum = "=0.8.4"
chrono = { version = "=0.4.41", default-features = false, features = ["clock", "std"] }
cookie = "=0.18.1"
csv = "=1.3.1"
fs2 = "=0.4.3"
hex = "=0.4.3"
hmac = "=0.12.1"
if-addrs = "=0.13.3"
percent-encoding = "=2.3.1"
pulldown-cmark = "=0.12.2"
rand = "=0.8.5"
reqwest = { version = "=0.12.15", default-features = false, features = ["json"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
rust-embed = "=8.5.0"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.8"
thiserror = "=2.0.11"
tokio = { version = "=1.44.2", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter"] }
webbrowser = "=1.0.2"
zip = { version = "=2.2.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[dev-dependencies]
http-body-util = "=0.1.3"
tempfile = "=3.19.1"
tower = { version = "=0.5.2", features = ["util"] }
urlencoding = "=2.1.3"

# Windows 下增量编译会写大量小文件，被杀软实时扫描后既拖慢编译
# （本项目实测 12s → 4min+），也会报 "error deleting lock file ... os error 5"。
# 这个项目的 crate 数量很少，关掉增量对日常开发几乎无损失。
[profile.dev]
incremental = false

[profile.test]
incremental = false
