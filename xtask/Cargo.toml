[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
publish = false

[dependencies]
anyhow = "=1.0.97"
chrono = { version = "=0.4.41", default-features = false, features = ["clock", "std"] }
hex = "=0.4.3"
serde_json = "=1.0.140"
sha2 = "=0.10.8"
zip = { version = "=2.2.2", default-features = false, features = ["deflate"] }
